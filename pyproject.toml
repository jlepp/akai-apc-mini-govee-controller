[project]
name = "akai-apc-mini"
version = "0.1.0"
description = "Control Govee lights with an Akai APC Mini MK2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3.3",
    "python-rtmidi>=1.5.8",
]

[project.scripts]
apc-govee = "main:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["apc_mini", "govee", "main"]
